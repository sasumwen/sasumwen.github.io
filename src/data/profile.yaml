# Bios (third person), approved 2026-11-23. `long` is the organiser bio used for the
# 15 November 2026 seminar.
bios:
  short:
    status: self-reported
    text: >-
      Osasu Imarhiagbe is an AI engineer, researcher and founder based in Calgary. He is Chief
      Technology Officer at StudyRadar and the founder of Xyricon Technologies, and he holds an
      MSc in Computer Science from the University of Lethbridge, where his research focused on
      boundary-aware brain-MRI segmentation for schizophrenia analysis.
  medium:
    status: self-reported
    text: >-
      Osasu Imarhiagbe is an AI engineer, researcher and founder. As Chief Technology Officer at
      StudyRadar he leads the engineering of an AI-powered exam-preparation platform for
      healthcare candidates; as founder of Xyricon Technologies he is developing Auron, a
      real-time AI co-pilot for emergency response. His MSc research at the University of
      Lethbridge introduced BoRefAttnNet, a boundary-refined 3D U-Net for subcortical brain
      segmentation, published in the ICICT 2026 proceedings (Springer). Earlier he worked as a
      software engineer and data scientist in Nigeria and served on the drafting team of the
      Nigeria Startup Act. He sits on the Board of Directors of the AIRI Foundation.
  long:
    status: self-reported
    text: >-
      Osasu Imarhiagbe is a computer scientist, AI researcher and technology entrepreneur based in
      Calgary, Alberta. He serves as the Chief Technology Officer of StudyRadar, an Alberta-based
      company developing AI-powered learning and clinical simulation tools to help healthcare
      students prepare for professional licensing examinations. He is also the founder of Xyricon
      Technologies, a Canadian deep-tech company developing Auron, an edge-AI co-pilot designed to
      support real-time 911 call triage, emergency incident coordination, and faster, more informed
      dispatch decisions. At StudyRadar, Osasu leads the company's technical strategy and AI
      development, including its engagement with the Alberta Machine Intelligence Institute (Amii)
      through the Level Up program. Osasu holds a Master of Science in Computer Science from the
      University of Lethbridge, where his research focused on advanced deep learning techniques,
      including boundary-enhanced medical image segmentation and spatial-temporal transformer
      models for automated schizophrenia analysis. Part of his research was presented at the 11th
      International Congress on Information and Communication Technology (ICICT 2026) and published
      in the conference proceedings by Springer Nature. His research has earned competitive
      academic and provincial funding, including the Alberta Innovates Graduate Student Scholarship
      and the University of Lethbridge Graduate Research Award. In 2025, he was selected as one of
      ten Canadian representatives to attend the International High-Performance Computing Summer
      School (IHPCSS) in Lisbon, Portugal, where he further developed his expertise in
      high-performance computing, parallel programming, and computational research. Beyond his
      technical and entrepreneurial work, Osasu
      serves on the Board of the AIRI Foundation (Artificial Intelligence for Responsible
      Inclusion), a Canadian nonprofit committed to advancing AI literacy, responsible adoption,
      and inclusive access to emerging technologies. His work sits at the intersection of
      artificial intelligence research, software engineering, entrepreneurship, and the practical
      application of emerging technologies to solve real-world problems.

