# Working principles shown on About → "How I work". Approved 2026-11-23.
values:
  status: self-reported
  items:
    - lead: Evidence first.
      text: A claim comes with its source, and a model gets evaluated before anyone is asked to trust it.
    - lead: Humans in charge.
      text: From triage systems to exam feedback, the person stays accountable and the machine stays legible.
    - lead: Build for the people having the worst day.
      text: Reliability over novelty.
    - lead: Write it down.
      text: Architecture, decisions and the reasons behind them, before the team grows.
    - lead: Send the elevator back down.
      text: Mentoring, boards and community are part of the job, not after it.

